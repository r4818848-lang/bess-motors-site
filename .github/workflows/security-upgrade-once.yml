name: Security dependency upgrade (one-time)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  upgrade-security:
    if: github.event.pull_request.head.ref == 'security-and-leads-20261118' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security-and-leads-20261118
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Update locked production dependencies with no force
        shell: bash
        run: |
          npm install 'jspdf@4.2.1' 'jspdf-autotable@5.0.9' --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const next = lock.packages?.['node_modules/next']?.version || '';
          const jspdf = lock.packages?.['node_modules/jspdf']?.version || '';
          const table = lock.packages?.['node_modules/jspdf-autotable']?.version || '';
          console.log('SECURITY PATCH VERSIONS',JSON.stringify({next,jspdf,table}));
          const nv=next.split('.').map(Number);
          if (nv[0]!==15 || nv[1]!==5 || nv[2]<28 || jspdf!=='4.2.1' || table!=='5.0.9') process.exit(1);
          NODE
          npm audit --omit=dev --json > security-post.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync('security-post.json','utf8'));
          const issues=Object.entries(report.vulnerabilities||{}).filter(([,v])=>v.severity==='critical');
          console.log('PRODUCTION AUDIT AFTER PATCH',JSON.stringify(report.metadata?.vulnerabilities||{}));
          if(issues.length){console.error('CRITICAL VULNERABILITIES REMAIN',issues.map(([name])=>name).join(','));process.exit(1);}
          NODE
      - name: Commit updated lockfile and manifest to PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Security: patch Next.js, jsPDF and PDF table dependencies"
            git push origin HEAD:security-and-leads-20261118
          else
            echo "No dependency changes"
          fi
