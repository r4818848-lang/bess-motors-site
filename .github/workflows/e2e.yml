name: E2E (Playwright)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dependency-security:
    # Separate security report: npm run audit checks site metadata, not package CVEs.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies without scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit production and full dependency tree
        shell: bash
        run: |
          npm audit --omit=dev --json > audit-prod.json || true
          npm audit --json > audit-all.json || true
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          for (const file of ['audit-prod.json', 'audit-all.json']) {
            const data = JSON.parse(readFileSync(file, 'utf8'));
            const records = Object.entries(data.vulnerabilities || {});
            const order = { critical: 0, high: 1, moderate: 2, low: 3 };
            const selected = records.filter(([,v]) => v.severity === 'critical' || v.severity === 'high').sort((a,b) => (order[a[1].severity] ?? 4) - (order[b[1].severity] ?? 4));
            console.log('AUDIT FILE', file, 'COUNTS', JSON.stringify(data.metadata?.vulnerabilities || {}));
            for (const [name, v] of selected) {
              const advisories = (v.via || []).filter(i => typeof i !== 'string').map(i => ({title:i.title,url:i.url,range:i.range}));
              console.log('AUDIT ISSUE',JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,advisories}));
            }
            if (data.error) { console.log('AUDIT ERROR', JSON.stringify(data.error)); process.exitCode = 1; }
            if (file === 'audit-prod.json' && Number(data.metadata?.vulnerabilities?.critical || 0) > 0) {
              console.error('BLOCKING DEPENDENCY RELEASE: critical production vulnerability detected');
              process.exitCode = 1;
            }
          }
          NODE
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Audit
        run: npm run audit

      - name: Lead notices, arrival hours, calendar and scheduler
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres
        run: npm run test:lead-notices && npm run test:unit

  e2e:
    # Pin supported OS: Playwright Chromium install fails on ubuntu26.04-x64.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # ubuntu-latest already has the Chromium shared libraries. --with-deps
      # also downloads extra fonts from azure.archive.ubuntu.com; a DNS
      # failure there aborts the job before any test runs.
      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Build
        run: npm run build

      - name: Run E2E tests
        env:
          CI: "true"
          E2E_ADMIN_PHONE: ${{ secrets.E2E_ADMIN_PHONE }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
